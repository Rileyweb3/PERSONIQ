<body><div id="app"></div>
<script>
(()=>{'use strict';const app=document.getElementById('app');const X='https://x.com/personiqid?s=11',TG='https://t.me/PERSONIQID';const navSections=['Overview','My Identity','Wallets','Credentials','Reputation','Privacy & Sharing','Connected Apps','Settings'];const icons={'Overview':'◫','My Identity':'◎','Wallets':'▣','Credentials':'◇','Reputation':'⌁','Privacy & Sharing':'◈','Connected Apps':'⌘','Settings':'⚙'};let page='landing',section='Overview',modal=null,toastTimer;let initial={name:'Alex Morgan',handle:'alex.morgan',bio:'Curious builder exploring the open web. This is an illustrative demo profile.',public:true,showWallets:true,showCredentials:true,shareEvidence:false,notifications:true,privacyDefault:'Ask every time',connectedApps:[],profileVisibility:true};let state={...initial};let credFilter='All',repFilter='All',expanded='';let shareResult='';
const creds=[{name:'Community Member',category:'Community Membership',issuer:'Example Community (fictional)',date:'Illustrative · 2025-02-14',status:'Simulation',evidence:'Example membership claim for demo exploration.'},{name:'Contributor Recognition',category:'Contributor Recognition',issuer:'Sample DAO (fictional)',date:'Illustrative · 2025-01-30',status:'Simulation',evidence:'A hypothetical recognition of community contributions.'},{name:'Web3 Foundations',category:'Course Completion',issuer:'Example Learning Hub (fictional)',date:'Illustrative · 2024-11-08',status:'Simulation',evidence:'Example course completion credential.'},{name:'Builder Week Attendee',category:'Event Participation',issuer:'Demo Event Organizers (fictional)',date:'Illustrative · 2024-10-21',status:'Simulation',evidence:'Illustrative participation record.'},{name:'Open Source Sprint',category:'Project Achievement',issuer:'Sample Project (fictional)',date:'Illustrative · 2024-08-12',status:'Simulation',evidence:'Example project achievement; no issuer is represented as real.'}];const apps=[{name:'Guildspace',purpose:'Community membership and participation (fictional example).',request:'Community Membership',perm:'Credential category only'},{name:'Buildboard',purpose:'Showcase contributor achievements (fictional example).',request:'Contributor Recognition',perm:'Credential name and illustrative date'},{name:'Eventpass',purpose:'Check event eligibility (fictional example).',request:'Event Participation',perm:'Participation claim'}];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const btn=(text,act,cls='btn')=>`<button class="${cls}" data-act="${act}">${text}</button>`;const panel=(inner,cl='')=>`<div class="panel ${cl}">${inner}</div>`;const wordmark=()=>`<a class="wordmark" href="#home" data-act="home"><span class="brand-mark">P</span><span>PERSONIQ<small>IDENTITY INFRASTRUCTURE</small></span></a>`;
function landing(){page='landing';app.innerHTML=`<header class="wrap nav">${wordmark()}<nav class="navlinks"><a href="#about">About</a><a href="#technology">Technology</a><a href="#usecases">Use cases</a><a href="#privacy">Privacy</a><a href="#community">Community</a>${btn('Explore demo →','demo','btn primary small')}</nav></header><main><section class="wrap hero"><div class="hero-copy"><div class="eyebrow">Decentralized identity infrastructure</div><h1>Your identity.<br>Your credentials.<br><span>Your control.</span></h1><p>PERSONIQ is building toward a more portable, user-owned identity layer for Web3—connecting digital identities, verifiable credentials, and reputation across compatible decentralized applications.</p><div class="actions">${btn('Explore the demo ↗','demo','btn primary')}${btn('Join the community','community','btn ghost')}</div><div class="note">A project vision, explored through a simulated product demo.</div></div><div class="hero-art"><div class="orbit"><div class="orbit-core"><b>P</b></div><div class="orbit-node node-a">◇</div><div class="orbit-node node-b">⌘</div><div class="orbit-node node-c">▣</div></div><div class="art-caption">IDENTITY · CREDENTIALS · CONSENT</div></div></section>
<section id="about" class="section alt"><div class="wrap problem"><div class="section-head"><div class="eyebrow">The problem</div><h2>Your digital identity is scattered.</h2><p>People participate across wallets, applications, and communities. Their credentials, achievements, and reputation can end up fragmented—so they may have to demonstrate the same things again and again.</p><p>PERSONIQ is exploring ways to make identity information more portable, with users at the center of how it is shared.</p></div><div class="statbox"><div class="eyebrow">One person · many disconnected contexts</div><div class="scatter"><div>Wallet A<span>Activity & assets</span></div><div>Community<span>Membership & work</span></div><div>Application<span>Profile & access</span></div><div>Credentials<span>Achievements</span></div></div><p class="tiny">Illustrative diagram · no live data or connections</p></div></div></section>
<section id="technology" class="section"><div class="wrap"><div class="section-head"><div class="eyebrow">The PERSONIQ approach</div><h2>A portable identity, designed around you.</h2><p>These are intended capabilities in the project vision, not claims of currently available product functionality.</p></div><div class="grid3">${[['◉','Portable digital identity','A profile that could travel across compatible decentralized applications.'],['▣','Wallet and profile connections','Supported connections to help associate identity contexts, subject to user consent.'],['◇','Verifiable credentials','Structured claims that an issuer could provide and an application could check.'],['⌁','Reputation evidence','A way to present relevant contribution evidence without inventing a universal score.'],['◈','Privacy and selective sharing','Clear choices about which supported details a user chooses to share.'],['⌘','Developer integrations','Tools for compatible applications to request and verify supported claims.']].map(([i,t,d])=>`<article class="tile"><div class="tile-icon">${i}</div><h3>${t}</h3><p>${d}</p></article>`).join('')}</div></div></section>
<section id="usecases" class="section alt"><div class="wrap"><div class="section-head"><div class="eyebrow">Potential use cases</div><h2>Useful identity, in more places.</h2></div><div class="grid3">${[['For people','Present relevant credentials when joining a new platform or community.'],['For communities','Evaluate membership and contributions with clearer, user-shared evidence.'],['For organizations','Issue achievements that people can carry to compatible services.'],['For applications','Check supported identity claims with a clear request and response.'],['For developers','Explore integrations for credential requests and verification.'],['For everyone','Make consent and disclosure part of the experience.']].map(([t,d])=>`<article class="tile"><h3>${t}</h3><p>${d}</p></article>`).join('')}</div></div></section>
<section id="privacy" class="section"><div class="wrap grid2"><div class="section-head"><div class="eyebrow">Privacy & control</div><h2>Sharing should be a choice.</h2><p>Our vision emphasizes user consent, transparent verification, and data minimization—sharing only what a particular use case needs.</p><p>Public blockchain data may remain visible and cannot necessarily be deleted or made private. Product controls cannot change that underlying reality.</p></div><div class="statbox"><div class="eyebrow">A thoughtful request</div><div class="steps"><div class="step"><h3>See what is requested</h3><p>Understand the specific credential or detail an application wants.</p></div><div class="step"><h3>Choose what to share</h3><p>Give the user a clear opportunity to approve or reject.</p></div><div class="step"><h3>Keep a record</h3><p>Make sharing activity easier to review and understand.</p></div></div>${btn('Try privacy controls','demo','btn small')}</div></div></section>
<section id="community" class="section alt"><div class="wrap community"><div><div class="eyebrow">Follow the journey</div><h2>Be Part of the PERSONIQ Journey.</h2><p class="copy">Follow the project as we develop our vision for more portable, user-owned digital identity in Web3.</p></div><div class="actions"><a class="btn primary" href="${TG}" target="_blank" rel="noopener">Join Telegram ↗</a><a class="btn" href="${X}" target="_blank" rel="noopener">Follow on X ↗</a></div></div></section>
<section class="section"><div class="wrap"><div class="section-head"><div class="eyebrow">Questions</div><h2>Frequently asked.</h2></div><div class="faq">${[['What is PERSONIQ?','PERSONIQ is developing toward a user-owned decentralized identity infrastructure for Web3. This website includes an interactive demonstration with simulated data.'],['What problem is PERSONIQ trying to solve?','Identity details, credentials, and community reputation can be scattered across applications. The project is exploring more portable ways to present relevant information.'],['What are verifiable credentials?','They are structured claims made by an issuer that can be checked by a verifier. The examples in this demo are fictional and are not live credentials.'],['How could portable reputation work?','A future approach could let people present relevant evidence from supported sources. The scoring methodology, if any, has not been finalized; this demo does not calculate a real score.'],['How does PERSONIQ approach privacy?','The project vision emphasizes consent, transparent requests, and data minimization. Blockchain data may remain public and cannot necessarily be deleted or made private.'],['Is the platform live?','This site is a product concept and interactive demo. Wallet connections, credential verification, publishing, and integrations are not live here.'],['Can developers integrate PERSONIQ?','Developer integrations are not enabled in this demo. The project may explore compatible integration tools as development progresses.']].map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join('')}</div></div></section></main><footer class="footer"><div class="wrap"><div class="footerline">${wordmark()}<span>Your identity. Your credentials. Your control.</span><div class="footerlinks"><a href="#about">About</a><a href="#technology">Technology</a><a href="${TG}" target="_blank" rel="noopener">Telegram</a><a href="${X}" target="_blank" rel="noopener">X</a>${btn('Explore demo','demo','btn small')}</div></div><div class="disclaimer">PERSONIQ interactive demo. Product capabilities described here are proposed and are not represented as live services. Sample information is fictional and illustrative.</div><div class="disclaimer copyright">© PERSONIQ · Provisional wordmark until supplied logo assets are added.</div></div></footer>`}
function renderDemo(){page='demo';const nav=navSections.map(s=>`<button class="side-link ${section===s?'active':''}" data-act="section" data-value="${s}"><span>${icons[s]}</span>${s}</button>`).join('');app.innerHTML=`<div class="demo"><header class="demo-top"><div class="row">${btn('☰','menu','iconbtn mobilemenu')}${wordmark()}</div><div class="row"> <span class="statuspill">INTERACTIVE DEMO — SIMULATED DATA</span>${btn('← Website','home','btn small ghost')}</div></header><div class="demo-layout"><aside class="sidebar" id="sidebar"><div class="side-label">Workspace</div>${nav}<div class="side-label" style="margin-top:22px">Demo account</div><div class="identity" style="padding:10px"><div class="avatar">AM</div><div><b style="font-size:12px">${esc(state.name)}</b><div class="tiny">Illustrative profile</div></div></div></aside><main class="demo-main">${screen()}</main></div></div>`;modalRender()}
function header(title,sub){return `<div class="demo-head"><div><div class="eyebrow">PERSONIQ · DEMO WORKSPACE</div><h1>${title}</h1><div class="muted">${sub}</div></div><span class="statuspill">SIMULATED DATA</span></div>`}
function screen(){switch(section){case'Overview':return overview();case'My Identity':return identity();case'Wallets':return wallets();case'Credentials':return credentials();case'Reputation':return reputation();case'Privacy & Sharing':return privacy();case'Connected Apps':return connected();case'Settings':return settings()}return overview()}
function overview(){return `${header('Your identity, at a glance','An illustrative snapshot. Nothing here is connected to a live service.')}<div class="demo-grid"><div class="panel click" data-act="section" data-value="My Identity"><div class="identity"><div class="avatar big">AM</div><div><h3>${esc(state.name)}</h3><div class="muted">@${esc(state.handle)}</div></div></div><p class="tiny">SAMPLE IDENTITY · FICTIONAL</p></div><div class="panel click" data-act="section" data-value="Credentials"><div class="row"><h3>Credentials</h3><span class="tag sim">ILLUSTRATIVE</span></div><div class="metric">05</div><div class="muted">Example credential cards</div></div><div class="panel click" data-act="section" data-value="Reputation"><div class="row"><h3>Reputation evidence</h3><span class="tag">No score</span></div><div class="metric">03</div><div class="muted">Example evidence items · not a trust rating</div></div></div><div class="demo-grid two" style="margin-top:14px"><div class="panel click" data-act="section" data-value="Wallets"><h3>Example wallets <span class="tag sim">SIMULATED</span></h3><div class="mono">0x71C4…9A2F</div><div class="tiny">Illustrative address · not connected</div><div class="mono" style="margin-top:10px">0xB903…14D8</div><div class="tiny">Illustrative address · not connected</div></div><div class="panel click" data-act="section" data-value="Privacy & Sharing"><h3>Privacy snapshot</h3><div class="row"><span class="muted">Profile visibility</span><span class="tag ${state.public?'good':''}">${state.public?'Public preview on':'Private'}</span></div><div class="row" style="margin-top:10px"><span class="muted">Sharing requests</span>${btn('Review controls →','section:Privacy & Sharing','btn small')}</div></div></div><div class="demo-grid two" style="margin-top:14px"><div class="panel"><h3>Recent simulated activity</h3>${activity('Profile preview updated','Local demo state · just now')}${activity('Credential request reviewed','Example app · simulated')}${activity('Sample credential added','Illustrative record')}</div><div class="panel"><h3>Quick actions</h3><div class="actions">${btn('Edit identity','section:My Identity','btn small')}${btn('Review credentials','section:Credentials','btn small')}${btn('Privacy settings','section:Privacy & Sharing','btn small')}</div><p class="tiny">All changes stay in this local demo session.</p></div></div>`}
function activity(t,d){return `<div class="activity"><div class="dot"></div><div><b style="font-size:12px">${t}</b><div class="tiny">${d}</div></div></div>`}
function identity(){return `${header('My Identity','Edit a local sample profile and preview how selected information may appear.')}<div class="demo-grid two"><div class="panel"><div class="identity"><div class="avatar big">${esc(state.name.split(' ').map(x=>x[0]).join('').slice(0,2))}</div><div><h3>${esc(state.name)}</h3><div class="muted">@${esc(state.handle)}</div></div></div><p class="mono" style="margin-top:20px">personiq:demo:7f3a-illustrative-204b</p><div class="tiny">Sample identity identifier · not registered</div><hr style="border:0;border-top:1px solid var(--border);margin:20px 0"><form id="profileForm" class="list"><label class="field">Display name<input name="name" value="${esc(state.name)}" maxlength="40"></label><label class="field">Username<input name="handle" value="${esc(state.handle)}" maxlength="30"></label><label class="field">Biography<textarea name="bio" maxlength="180">${esc(state.bio)}</textarea></label><button class="btn primary" type="submit">Save local profile</button></form></div><div class="panel"><h3>Public profile preview</h3>${profilePreview()}<div class="actions">${btn('Copy demo profile link','copy','btn small')}${btn('Share profile preview','shareprofile','btn small')}</div><p class="tiny">No profile is published. This preview reflects only local demo settings.</p></div></div>`}
function profilePreview(){return `<div class="public-preview">${state.public?`<div class="identity"><div class="avatar">${esc(state.name.split(' ').map(x=>x[0]).join('').slice(0,2))}</div><div><b>${esc(state.name)}</b><div class="muted">@${esc(state.handle)}</div></div></div><p class="muted">${esc(state.bio)}</p>${state.showWallets?'<span class="tag">Wallet addresses hidden by default</span>':''}${state.showCredentials?'<p class="tiny">Selected credentials · illustrative examples</p>':''}`:'<p>Profile preview is private.</p>'}</div>`}
function wallets(){return `${header('Wallets','Illustrative wallet records only. No wallet provider is contacted.')}<div class="callout">Wallet ownership verification may require a user-approved signature in a future product. This demo never requests signatures or secrets.</div><div class="demo-grid two" style="margin-top:14px">${['0x71C4…9A2F','0xB903…14D8'].map((x,i)=>`<div class="panel"><div class="row"><h3>Example wallet ${i+1}</h3><span class="tag sim">SIMULATED</span></div><div class="mono">${x}</div><p class="muted">Illustrative example · Ethereum-compatible format (not connected)</p><span class="tag">Connection status: simulated</span></div>`).join('')}</div><div class="actions">${btn('＋ Connect wallet','unavailable','btn primary')}</div>`}
function credentials(){let list=creds.filter(c=>credFilter==='All'||c.category===credFilter);return `${header('Credentials','Fictional sample claims. No credential here is authentic or live-verified.')}<div class="filterbar">${['All',...new Set(creds.map(c=>c.category))].map(f=>`<button class="filter ${credFilter===f?'active':''}" data-act="credfilter" data-value="${esc(f)}">${f}</button>`).join('')}</div><div class="demo-grid">${list.map(c=>`<article class="panel click" data-act="credential" data-value="${esc(c.name)}"><div class="row"><span class="tag sim">${c.category}</span><span class="tiny">↗</span></div><h3 style="margin-top:17px">${c.name}</h3><p class="muted">${c.issuer}</p><div class="row"><span class="tiny">${c.date}</span><span class="tag">${c.status}</span></div></article>`).join('')}</div><div class="actions">${btn('Simulate verification','verify','btn')}${btn('＋ Issue credential','unavailable','btn primary')}</div>`}
function reputation(){return `${header('Reputation evidence','Explore illustrative evidence without reducing a person to a fabricated score.')}<div class="callout">No reputation score is calculated. These fictional examples do not reflect transaction history, wallet balances, or trustworthiness.</div><div class="filterbar" style="margin-top:18px">${['All','Verified credentials','Supported contributions','Community recognition','Self-reported'].map(f=>`<button class="filter ${repFilter===f?'active':''}" data-act="repfilter" data-value="${f}">${f}</button>`).join('')}</div><div class="list">${[['Verified credentials','Course completion example','Illustrative credential record'],['Supported contributions','Open source activity example','Would require a supported evidence source'],['Community recognition','Contributor note example','Fictional community-issued recognition'],['Self-reported','Builder profile statement','User-provided information · not independently verified']].filter(x=>repFilter==='All'||repFilter===x[0]).map(x=>`<div class="listitem"><div class="row"><div><span class="tag">${x[0]}</span><h3 style="margin:8px 0 2px">${x[1]}</h3><div class="tiny">${x[2]}</div></div><button class="iconbtn" data-act="expand" data-value="${x[1]}" aria-label="Expand evidence">${expanded===x[1]?'−':'+'}</button></div>${expanded===x[1]?`<p class="muted">Evidence details are illustrative only. PERSONIQ has not verified this record or connected to an external data source.</p>`:''}</div>`).join('')}</div>`}
function privacy(){return `${header('Privacy & Sharing','Local controls change this preview only; they do not alter blockchain data or real app permissions.')}<div class="demo-grid two"><div class="panel"><h3>Profile visibility controls</h3>${[['public','Public profile visibility',state.public],['showWallets','Display selected wallet addresses',state.showWallets],['showCredentials','Display selected credentials',state.showCredentials],['shareEvidence','Share contribution evidence',state.shareEvidence]].map(([k,t,v])=>`<label class="switchrow"><span>${t}<div class="tiny">Local demo preference</div></span><input class="switch" type="checkbox" data-toggle="${k}" ${v?'checked':''}></label>`).join('')}<div style="margin-top:18px">${profilePreview()}</div></div><div class="panel"><h3>Simulated application request</h3><p class="muted">Example: Guildspace (fictional)</p><div class="listitem"><b>Requested information</b><ul class="muted"><li>Community Membership credential category</li><li>Credential status (sample)</li></ul><div class="tiny">No wallet address or biography requested. This is not a live app.</div></div><div class="actions">${btn('Approve locally','approve','btn primary')}${btn('Reject','reject','btn')}</div>${shareResult?`<div class="callout" style="margin-top:12px">${shareResult}</div>`:''}<h3 style="margin-top:25px">Sharing history</h3><div class="tiny">No simulated requests reviewed in this session.</div><div class="notice" style="margin-top:14px">Actions modify only local demo state. They do not grant or revoke real application permissions.</div></div></div>`}
function connected(){return `${header('Connected Apps','Fictional examples of how compatible applications might request supported claims.')}<div class="notice">No partnerships are implied. Integrations and connections are not enabled in this demo.</div><div class="demo-grid" style="margin-top:15px">${apps.map(a=>`<div class="panel"><div class="row"><h3>${a.name}</h3><span class="tag sim">FICTIONAL EXAMPLE</span></div><p class="muted">${a.purpose}</p><div class="listitem"><div class="tiny">REQUESTED CREDENTIAL</div><b>${a.request}</b><div class="tiny" style="margin-top:9px">Example permission · ${a.perm}</div></div><div class="actions">${btn(state.connectedApps.includes(a.name)?'Disconnect':'Simulate connect',`app:${a.name}`,'btn small')}</div></div>`).join('')}</div>`}
function settings(){return `${header('Settings','Preferences are local to this browser demo and can be reset at any time.')}<div class="demo-grid two"><div class="panel"><h3>Preferences</h3>${[['notifications','Product notifications (sample preference)',state.notifications]].map(([k,t,v])=>`<label class="switchrow"><span>${t}<div class="tiny">Does not subscribe to a real service</div></span><input class="switch" type="checkbox" data-toggle="${k}" ${v?'checked':''}></label>`).join('')}<label class="field" style="margin-top:17px">Privacy default<select id="privacyDefault">${['Ask every time','Share nothing by default','Use saved local preferences'].map(x=>`<option ${state.privacyDefault===x?'selected':''}>${x}</option>`).join('')}</select></label></div><div class="panel"><h3>Reset demo</h3><p class="muted">Restore the original sample profile and local preferences.</p>${btn('Reset demo','reset','btn')}</div></div>`}
function unavailable(title='Feature unavailable'){modal={title,body:'You\'re exploring the PERSONIQ interactive demo. This feature is not available yet. The interface demonstrates how the future product could work. Follow our official channels for development updates.'};renderDemo()}
function showModal(title,body,buttons){modal={title,body,buttons};modalRender()}
function modalRender(){let old=document.getElementById('modalback');if(old)old.remove();if(!modal)return;const m=document.createElement('div');m.id='modalback';m.className='modalback';m.innerHTML=`<section class="modal" role="dialog" aria-modal="true" aria-labelledby="modaltitle"><div class="row"><span class="eyebrow">PERSONIQ · INTERACTIVE DEMO</span><button class="iconbtn" data-act="closemodal" aria-label="Close">×</button></div><h2 id="modaltitle">${esc(modal.title)}</h2><div>${modal.body}</div><div class="modal-actions">${(modal.buttons||[]).map(b=>btn(b.text,b.action,b.cls||'btn')).join('')}${btn('Close','closemodal','btn ghost')}</div></section>`;document.body.append(m)}
function toast(msg){let e=document.querySelector('.toast');if(e)e.remove();e=document.createElement('div');e.className='toast';e.textContent=msg;document.body.append(e);clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.remove(),2600)}
function goDemo(s='Overview'){modal=null;section=s;renderDemo();window.scrollTo(0,0)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=b.dataset.value;if(a==='demo'){goDemo('Overview')}else if(a==='home'){modal=null;landing();window.scrollTo(0,0)}else if(a==='community'){document.getElementById('community')?.scrollIntoView({behavior:'smooth'})}else if(a==='section'){goDemo(v)}else if(a.startsWith('section:'))goDemo(a.split(':')[1]);else if(a==='menu')document.getElementById('sidebar').classList.toggle('open');else if(a==='unavailable')unavailable();else if(a==='closemodal'){modal=null;document.getElementById('modalback')?.remove()}else if(a==='credfilter'){credFilter=v;renderDemo()}else if(a==='repfilter'){repFilter=v;renderDemo()}else if(a==='credential'){const c=creds.find(x=>x.name===v);showModal(c.name,`<div class="list"><div><span class="tiny">ISSUER</span><div>${esc(c.issuer)}</div></div><div><span class="tiny">SUBJECT</span><div>Illustrative demo profile</div></div><div><span class="tiny">EVIDENCE</span><div>${esc(c.evidence)}</div></div><div><span class="tiny">ISSUED</span><div>${esc(c.date)}</div></div><div><span class="tiny">STATUS</span><div><span class="tag sim">${c.status} · NOT LIVE VERIFIED</span></div></div></div>`,[{text:'Simulate verification',action:'verify',cls:'btn primary'}])}else if(a==='verify'){showModal('Illustrative demo result — not a live verification.','This sample credential format is displayed for exploration only. No issuer, blockchain, or live verification service was contacted.')}else if(a==='expand'){expanded=expanded===v?'':v;renderDemo()}else if(a==='approve'||a==='reject'){shareResult=a==='approve'?'Approved locally for this demo session. No real information was shared.':'Request rejected locally. No real application permission was changed.';renderDemo()}else if(a==='copy'){navigator.clipboard?.writeText('https://personiq.example/demo/profile/alex-morgan').then(()=>toast('Copied demo URL: personiq.example/demo/profile/alex-morgan')).catch(()=>toast('Demo URL: personiq.example/demo/profile/alex-morgan'));if(!navigator.clipboard)toast('Demo URL: personiq.example/demo/profile/alex-morgan')}else if(a==='shareprofile'){showModal('Profile preview',`${profilePreview()}<p class="notice">This is a local preview. Public profile publishing is not available.</p>`)}else if(a.startsWith('app:')){const name=a.slice(4);state.connectedApps=state.connectedApps.includes(name)?state.connectedApps.filter(x=>x!==name):[...state.connectedApps,name];showModal('Developer integrations unavailable',`Your ${name} control changed only its local simulated status. Developer integrations are not enabled in this demo.`);renderDemo()}else if(a==='reset'){showModal('Reset sample demo?','This restores the original fictional profile and clears local demo preferences.',[{text:'Reset demo',action:'confirmreset',cls:'btn primary'}])}else if(a==='confirmreset'){state={...initial};credFilter='All';repFilter='All';shareResult='';modal=null;goDemo('Overview');toast('Demo reset to original sample data')}else if(a==='unavailableConfirm')unavailable()});
document.addEventListener('change',e=>{if(e.target.matches('[data-toggle]')){state[e.target.dataset.toggle]=e.target.checked;renderDemo()}if(e.target.id==='privacyDefault'){state.privacyDefault=e.target.value}});document.addEventListener('submit',e=>{if(e.target.id==='profileForm'){e.preventDefault();const d=new FormData(e.target);state.name=d.get('name').trim()||initial.name;state.handle=d.get('handle').trim().replace(/^@/,'')||initial.handle;state.bio=d.get('bio').trim();renderDemo();toast('Local demo profile updated')}});document.addEventListener('click',e=>{if(e.target.id==='modalback'){modal=null;e.target.remove()}});landing();
})();
</script></body></html>
